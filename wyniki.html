<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga Squasha — Wyniki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #080c10;
    --surface:   rgba(255,255,255,0.04);
    --glass:     rgba(255,255,255,0.06);
    --border:    rgba(255,255,255,0.10);
    --border-hi: rgba(255,255,255,0.18);
    --muted:     #5a6680;
    --text:      #dde4f0;
    --c0: #c8ff00;
    --c1: #00e5ff;
    --c2: #ff8c42;
    --c3: #b06aff;
    --red: #ff4d4d;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Rajdhani', 'Arial', sans-serif;
    min-height: 100vh; padding: 0 0 80px; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -5%, rgba(200,255,0,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 95% 95%,  rgba(0,229,255,0.07) 0%, transparent 55%),
      radial-gradient(ellipse 40% 30% at 5%  70%,  rgba(176,106,255,0.05) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(200,255,0,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,255,0,0.022) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 0;
  }

  /* ── NAV ── */
  .nav { background: rgba(8,12,16,0.85); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--c0); padding: 14px 16px 14px 0; margin-right: 8px; border-right: 1px solid var(--border); white-space: nowrap; flex-shrink: 0; text-shadow: 0 0 20px rgba(200,255,0,0.4); }
  .nav-link { display: flex; align-items: center; gap: 6px; padding: 14px 16px; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; flex-shrink: 0; text-transform: uppercase; }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { color: var(--c0); border-bottom-color: var(--c0); text-shadow: 0 0 12px rgba(200,255,0,0.3); }

  /* ── PAGE ── */
  .page-wrap { padding: 36px 16px 0; position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 36px; }
  .pill { display: inline-block; background: var(--c0); color: #0a0f08; font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 3px; padding: 4px 14px; border-radius: 100px; margin-bottom: 14px; text-transform: uppercase; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(42px, 9vw, 76px); line-height: .92; letter-spacing: 2px; color: #fff; }
  h1 span { color: var(--c0); text-shadow: 0 0 30px rgba(200,255,0,0.4), 0 0 60px rgba(200,255,0,0.15); }
  .sub { font-size: 16px; font-weight: 600; color: var(--muted); margin-top: 10px; }

  /* ── SELECTOR ROWS ── */
  .selector-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .selector-label { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-right: 4px; white-space: nowrap; }

  /* ── TABS ── */
  .tab-btn {
    font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 7px 16px; border-radius: 9px; cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    transition: all .15s; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--border-hi); }
  .tab-btn.active { color: #0a0f08; border-color: transparent; }
  .tab-btn.latest::after { content: " ●"; font-size: 9px; color: var(--c0); }

  /* Przyciski kolejek */
  .round-btn {
    font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.3px; text-transform: uppercase;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    transition: all .15s; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .round-btn .r-num  { font-size: 14px; }
  .round-btn .r-date { font-size: 10px; opacity: .7; }
  .round-btn:hover   { color: var(--text); border-color: var(--border-hi); }
  .round-btn.active  { color: #0a0f08; border-color: transparent; }

  /* Przyciski grup */
  .group-btn {
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px;
    padding: 6px 18px; border-radius: 9px; cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    transition: all .15s;
  }
  .group-btn:hover  { color: var(--text); border-color: var(--border-hi); }
  .group-btn.active { color: #0a0f08; border-color: transparent; }

  /* ── SEKCJA WYNIKÓW ── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px; color: var(--muted);
    margin: 28px 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── TABLE CARD ── */
  .table-card {
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    position: relative; margin-bottom: 20px;
  }
  .table-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent-day); opacity: 0.7; }
  .table-scroll { overflow-x: auto; }

  /* ── RANKING TABLE ── */
  .rank-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rank-table th { padding: 11px 13px; text-align: left; font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); white-space: nowrap; }
  .rank-table th.c { text-align: center; }
  .rank-table td { padding: 10px 13px; border-bottom: 1px solid rgba(255,255,255,0.04); font-weight: 600; white-space: nowrap; }
  .rank-table tr:last-child td { border-bottom: none; }
  .rank-table tr:hover td { background: rgba(255,255,255,0.03); }
  .rank-table td.c { text-align: center; }
  .pos-1 { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#ffd700; }
  .pos-2 { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#c0c0c0; }
  .pos-3 { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#cd7f32; }
  .pos-n { font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--muted); }
  .pname { font-size:15px; font-weight:700; }
  .pname.t1 { color:#ffd700; text-shadow:0 0 10px rgba(255,215,0,.3); }
  .pname.t2 { color:#c0c0c0; }
  .pname.t3 { color:#cd7f32; }
  .pts-cell { font-weight:800; text-align:center; }

  /* ── LOADING / ERROR ── */
  .state-box { text-align: center; padding: 60px 20px; color: var(--muted); }
  .state-box .icon { font-size: 48px; margin-bottom: 14px; }
  .state-box p { font-size: 14px; font-weight: 600; }
  .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(200,255,0,0.15); border-top-color: var(--c0); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FOOTER ── */
  footer { text-align: center; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.1); margin-top: 40px; letter-spacing: 0.5px; text-transform: uppercase; }

  /* ── MATCH GRID (siatka meczów) ─────────────────────────────
     Klasy pomocnicze używane przez renderMatchGrid()
  ── */
  .match-grid-table {
    border-collapse: collapse;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    min-width: 100%;
  }
  /* Nagłówek z nazwą gracza (kolumna) */
 .mg-header-player div {
  display: block;
}
 /* PO */
.mg-header-player {
  padding: 8px 4px;
  font-size: 11px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
  letter-spacing: 0.5px; text-transform: uppercase; text-align: center;
  background: rgba(0,0,0,0.28);
  border: 1px solid rgba(255,255,255,0.08);
  white-space: normal;
  word-break: break-word;
  max-width: 80px;
  width: 80px;
}
  /* Podkolumny: S1 S2 S3 W */
  /* PO */
.mg-sub-header {
  padding: 4px 2px;
  font-size: 10px; font-weight: 900; letter-spacing: 1px;
  text-align: center; color: var(--muted);
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(255,255,255,0.07);
  text-transform: uppercase;
  width: 20px;
  min-width: 20px;
}
  }
  /* Komórka z nazwą gracza (wiersz) */
  /* PO */
.mg-row-player {
  padding: 8px 14px;
  font-size: 13px; font-weight: 700;
  white-space: nowrap; vertical-align: middle;
  border: 1px solid rgba(255,255,255,0.08);
  font-family: 'Rajdhani', sans-serif;
  width: 1%; /* kurczy się do minimalnej potrzebnej szerokości */
}
  /* Przekątna (gracz vs siebie) */
  .mg-diagonal {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.05);
  }
  /* Wynik pojedynczego seta (liczby punktów) */
  .mg-score {
  padding: 6px 4px;
  text-align: center; font-weight: 600;
  background: rgba(0,0,0,0.18);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--text);
  width: 20px;
  min-width: 20px;
}

.mg-result {
  padding: 6px 4px;
  text-align: center; font-weight: 800;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.10);
  width: 20px;
  min-width: 20px;
}
  /* Mecz nierozegrany */
  .mg-empty {
    padding: 8px;
    text-align: center; color: var(--muted);
    font-size: 18px;
    background: rgba(0,0,0,0.10);
    border: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  /* Narożnik nagłówka */
  /* PO */
.mg-corner {
  padding: 8px 12px;
  font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); text-align: center; vertical-align: middle;
  background: rgba(0,0,0,0.35);

  width: 1%;
}
</style>

<!-- ═══ KONFIGURACJA ══════════════════════════════════════════ -->
<script>
  // ⬇ Wklej URL swojego Web Appa (Kod_Wyniki.gs)
  const WYNIKI_URL = "https://script.google.com/macros/s/AKfycbw3N6sNxh4YZi0yapOlh_G288wln4kF-IGVyGHtpEFQDcJD9-gRgZV0ZZbb9pDV8tFhMw/exec";

  const DAY_CONFIG = {
    thu: { label: "Czwartek",     color: "#c8ff00" },
    tue: { label: "Wtorek",       color: "#00e5ff" },
    sat: { label: "Sobota",       color: "#ff8c42" },
    mon: { label: "Poniedziałek", color: "#b06aff" },
  };

  const DAY_ORDER = ["thu", "tue", "sat", "mon"]; // kolejność zakładek
</script>
<!-- ══════════════════════════════════════════════════════════ -->

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">🎾 WPC</div>
    <a class="nav-link"        href="index.html">📋 Zapisy</a>
    <a class="nav-link active" href="wyniki.html">🏆 Wyniki</a>
    <a class="nav-link"        href="ranking.html">📊 Ranking</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="header">
    <div class="pill">🏆 Wyniki Kolejek</div>
    <h1>WYNIKI <span>LIGI</span></h1>
    <p class="sub">Wybierz dzień, sezon, kolejkę i grupę</p>
  </div>

  <!-- Selektor dnia -->
  <div class="selector-row">
    <span class="selector-label">Dzień:</span>
    <div id="dayTabs"></div>
  </div>

  <!-- Selektor sezonu -->
  <div class="selector-row" id="seasonRow" style="display:none">
    <span class="selector-label">Sezon:</span>
    <div id="seasonTabs"></div>
  </div>

  <!-- Selektor kolejki -->
  <div class="selector-row" id="roundRow" style="display:none">
    <span class="selector-label">Kolejka:</span>
    <div id="roundTabs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>

  <!-- Selektor grupy -->
  <div class="selector-row" id="groupRow" style="display:none">
    <span class="selector-label">Grupa:</span>
    <div id="groupTabs"></div>
  </div>

  <!-- Obszar wyników -->
  <div id="contentArea">
    <div class="state-box">
      <div class="icon">🏆</div>
      <p>Wybierz dzień, sezon i kolejkę aby zobaczyć wyniki</p>
    </div>
  </div>

  <footer>Made by Karol Kreczmański</footer>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let state = {
  meta:         {},    // { thu: { seasons:[], latest:4 }, ... }
  activeDay:    null,
  activeSeason: null,
  activeRound:  null,
  activeGroup:  null,
  rounds:       [],    // [ { round, date, groups[] }, ... ]
};

// ══════════════════════════════════════════════════════════════
//  API (JSONP — omija CORS przy wywołaniu z pliku lokalnego)
// ══════════════════════════════════════════════════════════════
function api(params) {
  return new Promise((resolve, reject) => {
    const cb = "jsonp_" + Math.random().toString(36).slice(2);
    let script;
    const t = setTimeout(() => {
      delete window[cb];
      if (script) script.remove();
      reject(new Error("timeout"));
    }, 15000);
    window[cb] = data => {
      clearTimeout(t);
      delete window[cb];
      if (script) script.remove();
      resolve(data);
    };
    script = document.createElement("script");
    script.src = WYNIKI_URL + "?" + new URLSearchParams({ ...params, callback: cb });
    script.onerror = () => { clearTimeout(t); delete window[cb]; reject(new Error("błąd sieci")); };
    document.head.appendChild(script);
  });
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
async function init() {
  try {
    const res = await api({ action: "meta" });
    if (!res.ok) { showError(res.error); return; }
    state.meta = res.meta;

    state.activeDay    = DAY_ORDER.find(d => state.meta[d]) || Object.keys(state.meta)[0];
    state.activeSeason = state.meta[state.activeDay]?.latest || 1;

    renderDayTabs();
    await loadRounds();
  } catch(e) {
    showError("Nie można połączyć się z serwerem: " + e.message);
  }
}

// ══════════════════════════════════════════════════════════════
//  RENDER: zakładki dnia
// ══════════════════════════════════════════════════════════════
function renderDayTabs() {
  const el = document.getElementById("dayTabs");
  el.style.display = "flex"; el.style.gap = "6px"; el.style.flexWrap = "wrap";
  el.innerHTML = "";
  for (const key of DAY_ORDER) {
    if (!state.meta[key]) continue;
    const cfg = DAY_CONFIG[key];
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (key === state.activeDay ? " active" : "");
    btn.textContent = cfg.label;
    if (key === state.activeDay) btn.style.background = cfg.color;
    btn.addEventListener("click", async () => {
      state.activeDay    = key;
      state.activeSeason = state.meta[key].latest;
      state.activeRound  = null;
      state.activeGroup  = null;
      state.rounds       = [];
      renderDayTabs();
      hideGroupRow();
      clearContent();
      await loadRounds();
    });
    el.appendChild(btn);
  }
}

// ══════════════════════════════════════════════════════════════
//  RENDER: zakładki sezonu
// ══════════════════════════════════════════════════════════════
function renderSeasonTabs() {
  const row = document.getElementById("seasonRow");
  const el  = document.getElementById("seasonTabs");
  if (!state.meta[state.activeDay]) { row.style.display = "none"; return; }

  el.style.display = "flex"; el.style.gap = "6px"; el.style.flexWrap = "wrap";
  el.innerHTML = "";
  row.style.display = "flex";

  const seasons = [...state.meta[state.activeDay].seasons].sort((a,b) => b - a);
  const latest  = state.meta[state.activeDay].latest;
  const color   = DAY_CONFIG[state.activeDay]?.color || "#c8ff00";

  for (const s of seasons) {
    const btn = document.createElement("button");
    btn.className = "tab-btn"
      + (s === state.activeSeason ? " active" : "")
      + (s === latest ? " latest" : "");
    btn.textContent = "Sezon " + s;
    if (s === state.activeSeason) btn.style.background = color;
    btn.addEventListener("click", async () => {
      state.activeSeason = s;
      state.activeRound  = null;
      state.activeGroup  = null;
      state.rounds       = [];
      renderSeasonTabs();
      hideGroupRow();
      clearContent();
      await loadRounds();
    });
    el.appendChild(btn);
  }
}

// ══════════════════════════════════════════════════════════════
//  LOAD: lista kolejek
// ══════════════════════════════════════════════════════════════
async function loadRounds() {
  showContentLoading();
  renderSeasonTabs();
  document.getElementById("roundRow").style.display = "none";

  try {
    const res = await api({
      action:  "rounds",
      dayKey:  state.activeDay,
      season:  state.activeSeason,
    });
    if (!res.ok) { showError(res.error); return; }

    state.rounds = res.rounds; // posortowane malejąco
    renderRoundTabs();

    if (state.rounds.length > 0) {
      state.activeRound = state.rounds[0].round;
      state.activeGroup = state.rounds[0].groups[0];
      renderRoundTabs();
      renderGroupTabs(state.rounds[0].groups);
      await loadResults();
    } else {
      showError("Brak kolejek w tym sezonie");
    }
  } catch(e) {
    showError("Błąd ładowania kolejek: " + e.message);
  }
}

// ══════════════════════════════════════════════════════════════
//  RENDER: przyciski kolejek
// ══════════════════════════════════════════════════════════════
function renderRoundTabs() {
  const row   = document.getElementById("roundRow");
  const el    = document.getElementById("roundTabs");
  const color = DAY_CONFIG[state.activeDay]?.color || "#c8ff00";
  el.innerHTML = "";
  row.style.display = "flex";

  for (const r of state.rounds) {
    const btn = document.createElement("button");
    btn.className = "round-btn" + (r.round === state.activeRound ? " active" : "");
    btn.innerHTML = `<span class="r-num">${r.round}</span><span class="r-date">${r.date}</span>`;
    if (r.round === state.activeRound) btn.style.background = color;
    btn.addEventListener("click", async () => {
      state.activeRound = r.round;
      state.activeGroup = r.groups[0];
      renderRoundTabs();
      renderGroupTabs(r.groups);
      await loadResults();
    });
    el.appendChild(btn);
  }
}

// ══════════════════════════════════════════════════════════════
//  RENDER: przyciski grup (A / B / C)
// ══════════════════════════════════════════════════════════════
function renderGroupTabs(groups) {
  const row   = document.getElementById("groupRow");
  const el    = document.getElementById("groupTabs");
  const color = DAY_CONFIG[state.activeDay]?.color || "#c8ff00";
  el.style.display = "flex"; el.style.gap = "6px";
  el.innerHTML = "";

  if (groups.length <= 1) { row.style.display = "none"; return; }

  row.style.display = "flex";
  for (const g of groups) {
    const btn = document.createElement("button");
    btn.className = "group-btn" + (g === state.activeGroup ? " active" : "");
    btn.textContent = "Gr. " + g;
    if (g === state.activeGroup) btn.style.background = color;
    btn.addEventListener("click", async () => {
      state.activeGroup = g;
      renderGroupTabs(groups);
      await loadResults();
    });
    el.appendChild(btn);
  }
}

function hideGroupRow() {
  document.getElementById("groupRow").style.display = "none";
  document.getElementById("roundRow").style.display = "none";
}

// ══════════════════════════════════════════════════════════════
//  LOAD: wyniki kolejki
// ══════════════════════════════════════════════════════════════
async function loadResults() {
  showContentLoading();
  try {
    const res = await api({
      action:  "results",
      dayKey:  state.activeDay,
      season:  state.activeSeason,
      round:   state.activeRound,
      group:   state.activeGroup,
    });
    if (!res.ok) { showError(res.error); return; }
    renderResults(res);
  } catch(e) {
    showError("Błąd ładowania wyników: " + e.message);
  }
}

// ══════════════════════════════════════════════════════════════
//  RENDER: sekcja wyników (ranking + siatka meczów)
// ══════════════════════════════════════════════════════════════
function renderResults(data) {
  const area  = document.getElementById("contentArea");
  const color = DAY_CONFIG[state.activeDay]?.color || "#c8ff00";
  area.innerHTML = "";

  // ── Ranking kolejki ──────────────────────────────────────────
  if (data.rankingRows && data.rankingRows.length > 0) {
    const title = mkSectionTitle("Ranking kolejki", color);
    area.appendChild(title);

    const card   = mkCard(color);
    const scroll = document.createElement("div");
    scroll.className = "table-scroll";

    const table = document.createElement("table");
    table.className = "rank-table";

    // Nagłówek
    const thead = document.createElement("thead");
    const hr    = document.createElement("tr");
    data.rankingHeaders.forEach((h, i) => {
      const th = document.createElement("th");
      th.textContent = h;
      if (i !== 1) th.className = "c"; // wyśrodkuj wszystko poza "Gracz"
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    // Wiersze danych
    const tbody = document.createElement("tbody");
    data.rankingRows.forEach(row => {
      const pos = parseInt(row[0]) || 0;
      const tr  = document.createElement("tr");
      row.forEach((val, i) => {
        const td = document.createElement("td");
        if (i === 0) {
          // Miejsce — medal
          td.className = "c";
          const sp = document.createElement("span");
          const posMap = { 1:"pos-1", 2:"pos-2", 3:"pos-3" };
          sp.className = posMap[pos] || "pos-n";
          sp.textContent = pos === 1 ? "🥇" : pos === 2 ? "🥈" : pos === 3 ? "🥉" : pos;
          td.appendChild(sp);
        } else if (i === 1) {
          // Gracz — kolorowe imię dla top 3
          const nameMap = { 1:"t1", 2:"t2", 3:"t3" };
          const sp = document.createElement("span");
          sp.className = "pname " + (nameMap[pos] || "");
          sp.textContent = val;
          td.appendChild(sp);
        } else if (i === 10) {
          // Suma — wyróżniona kolorem dnia
          td.className = "pts-cell c";
          td.style.color = color;
          td.textContent = fmtNum(val);
        } else {
          td.className = "c";
          td.textContent = fmtNum(val);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    card.appendChild(scroll);
    area.appendChild(card);
  }

  // ── Siatka wyników meczów ────────────────────────────────────
  //
  //  Struktura danych z arkusza (A1:AK20):
  //   Wiersze 0-1 (1-2): nagłówki — nazwy graczy co 4 kol. (B1=gracz1, F1=gracz2 ...)
  //   Wiersze 2,3 (3,4): gracz 1 — każda para wierszy to jeden gracz
  //   Wiersze 4,5 (5,6): gracz 2, itd.
  //   W każdej grupie 4 kolumn: [S1][S2][S3][Wynik setów]
  //   Przekątna (gracz vs siebie): wyróżniona tłem, brak danych
  //
  if (data.matchData && data.matchData.length > 0) {
    const title2 = mkSectionTitle("Wyniki meczów", color);
    area.appendChild(title2);

    const card2   = mkCard(color);
    const scroll2 = document.createElement("div");
    scroll2.className = "table-scroll";

    const matchGrid = renderMatchGrid(data.matchData, color);
    if (matchGrid) {
      scroll2.appendChild(matchGrid);
    } else {
      scroll2.innerHTML = '<p style="padding:20px;color:var(--muted)">Brak danych meczów</p>';
    }

    card2.appendChild(scroll2);
    area.appendChild(card2);
  }

  if ((!data.rankingRows || data.rankingRows.length === 0) &&
      (!data.matchData   || data.matchData.length === 0)) {
    showError("Brak danych w tym pliku");
  }
}

// ══════════════════════════════════════════════════════════════
//  renderMatchGrid — siatka wyników meczów
//
//  Buduje tabelę HTML odzwierciedlającą strukturę arkusza:
//   • Nagłówki kolumn: nazwy graczy (colspan=4 każdy)
//   • Podkolumny: S1 S2 S3 W (wynik setów)
//   • Wiersze: każdy gracz zajmuje 2 wiersze (rowspan=2 dla nazwy)
//   • Przekątna (gracz vs siebie): wyróżniony kolor, colspan=4 rowspan=2
//   • Komórki wyników setów: ciemniejsze tło
//   • Komórka z liczbą wygranych setów (W): jasniejsze tło, pogrubiona
//   • Nierozegrany mecz: szary myślnik
// ══════════════════════════════════════════════════════════════
function renderMatchGrid(matchData, color) {
  if (!matchData || matchData.length < 3) return null;

  const playerNames = [];
  for (let c = 1; c < matchData[0].length; c += 4) {
    const val = matchData[0][c];
    if (val !== "" && val !== null && val !== undefined) {
      playerNames.push(String(val).trim());
    }
  }
  const n = playerNames.length;
  if (n === 0) return null;

  const tbl = document.createElement("table");
  tbl.className = "match-grid-table";
  tbl.style.tableLayout = "fixed";

  // ── Nagłówek: wiersz 1 — narożnik + nazwy graczy ──
  const thead = document.createElement("thead");
  const hRow1 = document.createElement("tr");

  // Narożnik — stała szerokość na imię + nazwisko w jednej linii
  const corner = document.createElement("th");
  corner.className = "mg-corner";
  corner.rowSpan = 2;
  corner.textContent = "Gracz";
  corner.style.width = "120px";
  corner.style.minWidth = "120px";
  corner.style.maxWidth = "120px";
  hRow1.appendChild(corner);

  for (const name of playerNames) {
    const th = document.createElement("th");
    th.className = "mg-header-player";
    th.colSpan = 4;
    th.style.color = color;
    // imię i nazwisko jedno pod drugim, stała szerokość bloku
    th.style.width = "88px";
    th.style.minWidth = "88px";
    th.style.maxWidth = "88px";
   th.style.whiteSpace = "normal";
th.style.wordBreak = "break-word";
th.style.lineHeight = "1.3";
    const parts = name.trim().split(" ");
if (parts.length >= 2) {
  th.appendChild(document.createTextNode(parts[0]));
  th.appendChild(document.createElement("br"));
  th.appendChild(document.createTextNode(parts.slice(1).join(" ")));
} else {
  th.textContent = name;
}
    hRow1.appendChild(th);
  }
  thead.appendChild(hRow1);

  // ── Nagłówek: wiersz 2 — podkolumny S1 S2 S3 W ──
  const hRow2 = document.createElement("tr");
  for (let j = 0; j < n; j++) {
    ["S1", "S2", "S3", "W"].forEach(label => {
      const th = document.createElement("th");
      th.className = "mg-sub-header";
      th.textContent = label;
      th.style.width = "22px";
      th.style.minWidth = "22px";
      th.style.maxWidth = "22px";
      hRow2.appendChild(th);
    });
  }
  thead.appendChild(hRow2);
  tbl.appendChild(thead);

  // ── Wiersze danych ──
  const tbody = document.createElement("tbody");

  for (let i = 0; i < n; i++) {
    const rowA = matchData[2 + i * 2] || [];
    const rowB = matchData[3 + i * 2] || [];

    // ── Górny wiersz gracza i ──
    const tr1 = document.createElement("tr");
    tr1.style.borderTop = "2px solid rgba(255,255,255,0.18)";

    // Pierwsza kolumna — imię i nazwisko w jednej linii, stała szerokość
    const nameTd = document.createElement("td");
    nameTd.className = "mg-row-player";
    nameTd.rowSpan = 2;
    nameTd.style.color = color;
    nameTd.style.width = "120px";
    nameTd.style.minWidth = "120px";
    nameTd.style.maxWidth = "120px";
    nameTd.style.whiteSpace = "nowrap";
    nameTd.style.overflow = "hidden";
    nameTd.style.textOverflow = "ellipsis";
    nameTd.textContent = playerNames[i];
    tr1.appendChild(nameTd);

    for (let j = 0; j < n; j++) {
      const colStart = 1 + j * 4;
      const isEven = (i + j) % 2 === 0;

      if (i === j) {
        const diag = document.createElement("td");
        diag.className = "mg-diagonal";
        diag.colSpan = 4;
        diag.rowSpan = 2;
        tr1.appendChild(diag);
      } else {
        const s1 = rowA[colStart];
        const notPlayed = isNotPlayed(s1);

        if (notPlayed) {
          const ph = document.createElement("td");
          ph.className = "mg-empty";
          ph.colSpan = 4;
          ph.rowSpan = 2;
          ph.textContent = "—";
          ph.style.background = isEven
            ? "rgba(255,255,255,0.03)"
            : "rgba(0,0,0,0.30)";
          tr1.appendChild(ph);
        } else {
          for (let c = 0; c < 3; c++) {
            const td = document.createElement("td");
            td.className = "mg-score";
            td.textContent = fmtVal(rowA[colStart + c]);
            td.style.width = "22px";
            td.style.background = isEven
              ? "rgba(255,255,255,0.06)"
              : "rgba(0,0,0,0.35)";
            tr1.appendChild(td);
          }
          const wTd = document.createElement("td");
          wTd.className = "mg-result";
          wTd.style.color = color;
          wTd.style.width = "22px";
          wTd.textContent = fmtVal(rowA[colStart + 3]);
          wTd.style.background = isEven
            ? "rgba(255,255,255,0.13)"
            : "rgba(0,0,0,0.22)";
          tr1.appendChild(wTd);
        }
      }
    }
    tbody.appendChild(tr1);

    // ── Dolny wiersz gracza i ──
    const tr2 = document.createElement("tr");

    for (let j = 0; j < n; j++) {
      if (i === j) continue;

      const colStart = 1 + j * 4;
      const isEven = (i + j) % 2 === 0;
      const s1 = rowA[colStart];
      if (isNotPlayed(s1)) continue;

      for (let c = 0; c < 3; c++) {
        const td = document.createElement("td");
        td.className = "mg-score";
        td.textContent = fmtVal(rowB[colStart + c]);
        td.style.width = "22px";
        td.style.background = isEven
          ? "rgba(255,255,255,0.06)"
          : "rgba(0,0,0,0.35)";
        tr2.appendChild(td);
      }
      const wTd = document.createElement("td");
      wTd.className = "mg-result";
      wTd.style.color = color;
      wTd.style.width = "22px";
      wTd.textContent = fmtVal(rowB[colStart + 3]);
      wTd.style.background = isEven
        ? "rgba(255,255,255,0.13)"
        : "rgba(0,0,0,0.22)";
      tr2.appendChild(wTd);
    }
    tbody.appendChild(tr2);
  }

  tbl.appendChild(tbody);
  return tbl;
}

// ══════════════════════════════════════════════════════════════
//  POMOCNICZE
// ══════════════════════════════════════════════════════════════

// Czy komórka jest "nierozegrana" (pusta, null lub tekst niecyfrowy)?
function isNotPlayed(val) {
  if (val === "" || val === null || val === undefined) return true;
  if (typeof val === "string") {
    const s = val.trim();
    if (s === "") return true;
    // Jeśli to tekst (np. "WPROWADŹ WYNIK") a nie liczba — nierozegrany
    if (isNaN(Number(s))) return true;
  }
  return false;
}

// Formatowanie wartości w siatce meczów (liczba lub pusty string)
function fmtVal(val) {
  if (val === "" || val === null || val === undefined) return "";
  if (typeof val === "number") return Number.isInteger(val) ? String(val) : String(Math.round(val));
  return String(val).trim();
}

// Formatowanie liczb w tabeli rankingowej
function fmtNum(val) {
  if (val === "" || val === null || val === undefined) return "";
  if (typeof val === "number") {
    return Number.isInteger(val) ? val : parseFloat(val.toFixed(3));
  }
  return val;
}

// Tworzy element tytułu sekcji
function mkSectionTitle(text, color) {
  const div = document.createElement("div");
  div.className  = "section-title";
  div.style.color = color;
  div.textContent = text;
  return div;
}

// Tworzy kartę z podkreśleniem koloru dnia
function mkCard(color) {
  const div = document.createElement("div");
  div.className = "table-card";
  div.style.setProperty("--accent-day", color);
  return div;
}

// ── Stan UI ────────────────────────────────────────────────────
function showContentLoading() {
  document.getElementById("contentArea").innerHTML =
    `<div class="state-box"><div class="spinner"></div><p>Ładowanie wyników…</p></div>`;
}

function showError(msg) {
  document.getElementById("contentArea").innerHTML =
    `<div class="state-box"><div class="icon">❌</div><p>${msg}</p></div>`;
}

function clearContent() {
  document.getElementById("contentArea").innerHTML =
    `<div class="state-box"><div class="icon">🏆</div><p>Wybierz kolejkę aby zobaczyć wyniki</p></div>`;
}

// ── START ──────────────────────────────────────────────────────
init();
</script>
