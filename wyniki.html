<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga Squasha — Wyniki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #080c10;
    --surface:   rgba(255,255,255,0.04);
    --glass:     rgba(255,255,255,0.06);
    --border:    rgba(255,255,255,0.10);
    --border-hi: rgba(255,255,255,0.18);
    --muted:     #5a6680;
    --text:      #dde4f0;
    --accent:    #c8ff00;
    --accent2:   #00e5ff;
    --green:     #c8ff00;
    --red:       #ff4d4d;
    --c0: #c8ff00;
    --c1: #00e5ff;
    --c2: #ff8c42;
    --c3: #b06aff;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', 'Arial', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -5%, rgba(200,255,0,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 95% 95%,  rgba(0,229,255,0.07) 0%, transparent 55%),
      radial-gradient(ellipse 40% 30% at 5%  70%,  rgba(176,106,255,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,255,0,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,255,0,0.022) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── NAV ── */
  .nav {
    background: rgba(8,12,16,0.85);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 16px;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--c0);
    padding: 14px 16px 14px 0;
    margin-right: 8px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    flex-shrink: 0;
    text-shadow: 0 0 20px rgba(200,255,0,0.4);
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link.active {
    color: var(--c0);
    border-bottom-color: var(--c0);
    text-shadow: 0 0 12px rgba(200,255,0,0.3);
  }

  /* ── PAGE ── */
  .page-wrap {
    padding: 36px 16px 0;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 36px; }

  .pill {
    display: inline-block;
    background: var(--c0);
    color: #0a0f08;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 9vw, 76px);
    line-height: .92;
    letter-spacing: 2px;
    color: #fff;
  }
  h1 span {
    color: var(--c0);
    text-shadow: 0 0 30px rgba(200,255,0,0.4), 0 0 60px rgba(200,255,0,0.15);
  }

  .sub {
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  /* ── COMING SOON ── */
  .coming-soon {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .coming-soon .icon {
    font-size: 72px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 24px rgba(200,255,0,0.25));
  }
  .coming-soon h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    color: var(--text);
    margin-bottom: 10px;
  }
  .coming-soon p {
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .coming-card {
    display: inline-block;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 64px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .coming-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--c0);
    opacity: 0.6;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.1);
    margin-top: 40px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">🎾 WPC</div>
    <a class="nav-link"        href="index.html">📋 Zapisy</a>
    <a class="nav-link active" href="wyniki.html">🏆 Wyniki</a>
    <a class="nav-link"        href="ranking.html">📊 Ranking</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="header">
    <div class="pill">🏆 Wyniki Kolejek</div>
    <h1>WYNIKI <span>LIGI</span></h1>
    <p class="sub">Wybierz dzień i kolejkę aby zobaczyć wyniki</p>
  </div>

  <div class="coming-soon">
    <div class="coming-card">
      <div class="icon">🏆</div>
      <h2>W BUDOWIE</h2>
      <p>Ta sekcja zostanie uzupełniona o wyniki kolejek</p>
    </div>
  </div>

  <footer>Made by Karol Kreczmański</footer>
</div>

</body>
</html>
