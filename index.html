<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel ligi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; font-size: 15px; background: #f5f5f5; color: #1a1a1a; }

    .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px;
              display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header .meta { font-size: 13px; color: #666; }

    .main { max-width: 860px; margin: 24px auto; padding: 0 16px; }

    .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab  { padding: 8px 16px; border-radius: 6px; border: 1px solid #ddd;
            background: #fff; cursor: pointer; font-size: 14px; }
    .tab.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

    .card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

    .grupy { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .btn-grupa { padding: 9px 18px; border-radius: 6px; border: 1px solid #1a73e8;
                 background: #fff; color: #1a73e8; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-grupa:hover { background: #e8f0fe; }
    .btn-grupa:disabled { opacity: .5; cursor: default; }

    .kolejki-lista { list-style: none; }
    .kolejki-lista li { display: flex; align-items: center; justify-content: space-between;
                        padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .kolejki-lista li:last-child { border-bottom: none; }
    .kolejki-lista a { color: #1a73e8; text-decoration: none; }
    .kolejki-lista a:hover { text-decoration: underline; }

    .spinner { display: inline-block; width: 16px; height: 16px;
               border: 2px solid #ccc; border-top-color: #1a73e8;
               border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #333; color: #fff;
             padding: 12px 20px; border-radius: 8px; font-size: 14px;
             opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
    .toast.err { background: #c62828; }
    .pusty { color: #888; font-size: 14px; padding: 8px 0; }
  </style>
</head>
<body>

<!-- Overlay z hasłem — widoczny dopóki nie zalogowany -->
<div id="auth-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;
     background:#f5f5f5;z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:36px;width:320px;
       box-shadow:0 2px 12px rgba(0,0,0,0.1);">
    <h2 style="font-size:18px;font-weight:600;margin-bottom:8px;">Panel ligi</h2>
    <p id="auth-nazwa-ligi" style="font-size:13px;color:#666;margin-bottom:20px;"></p>
    <input id="haslo-input" type="password" placeholder="Hasło administratora"
      style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;
             font-size:15px;margin-bottom:12px;">
    <div id="haslo-blad" style="color:#c62828;font-size:13px;margin-bottom:10px;display:none;"></div>
    <button onclick="weryfikujHaslo()"
      style="width:100%;padding:11px;border-radius:6px;border:none;background:#1a73e8;
             color:#fff;font-size:15px;font-weight:500;cursor:pointer;">
      Zaloguj
    </button>
  </div>
</div>

<!-- Panel — zawsze w DOM, ukryty pod overlayem dopóki niezalogowany -->
<div class="header">
  <h1 id="tytul">Ładowanie...</h1>
  <span class="meta" id="email-info"></span>
</div>

<div class="main">
  <div class="tabs" id="tabs"></div>
  <div class="card" id="karta-utworz-kolejke">
    <h2 id="naglowek-kolejki">Utwórz kolejkę</h2>
    <div class="grupy" id="grupy"></div>
  </div>
  <div class="card">
    <h2>Istniejące kolejki</h2>
    <div id="lista-wrapper"><span class="pusty">Wybierz dzień powyżej.</span></div>
  </div>

  <div class="card" id="karta-recepcja">
    <h2>Lista obecności (Recepcja)</h2>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button id="btn-recepcja"
        style="padding:10px 24px;border-radius:6px;border:none;background:#1a73e8;
               color:#fff;font-size:14px;font-weight:500;cursor:pointer;">
        Utwórz listę dla <span id="btn-recepcja-dzien">...</span>
      </button>
      <span id="recepcja-info" style="font-size:13px;color:#888;"></span>
    </div>
  </div>

  <div class="card" id="karta-przypisania" style="display:none">
    <h2 id="naglowek-przypisania">Przypisz graczy do grup</h2>
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
      <div style="flex:0 0 200px;">
        <div style="font-size:13px;font-weight:600;color:#666;margin-bottom:8px;">Gracze</div>
        <div id="lista-graczy" style="min-height:100px;border:2px dashed #ddd;border-radius:8px;padding:19px 8px;"></div>
      </div>
      <div id="kolumny-grup" style="display:flex;gap:12px;flex-wrap:wrap;flex:1;"></div>
    </div>
<button id="btn-auto-przypisz"
      style="padding:10px 24px;border-radius:6px;border:1px solid #1a73e8;background:#fff;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;margin-right:8px;margin-top:16px;">
      Auto-przypisz graczy
    </button>
    <button id="btn-reset-przypisania"
      style="padding:10px 24px;border-radius:6px;border:1px solid #c62828;background:#fff;color:#c62828;font-size:14px;font-weight:500;cursor:pointer;margin-right:8px;margin-top:16px;">
      Reset
    </button>
    <div style="margin-top:12px;">
      <button id="btn-wyslij"
        style="padding:10px 24px;border-radius:6px;border:none;background:#1a73e8;color:#fff;font-size:14px;font-weight:500;cursor:pointer;">
        Wyślij do kolejek
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;width:320px;">
    <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">Pierwsza kolejka — podaj datę</h3>
    <p style="font-size:13px;color:#666;margin-bottom:12px;">Format: DD.MM (np. 08.06)</p>
    <input id="modal-data" type="text" placeholder="08.06" maxlength="5"
      style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:15px;margin-bottom:16px;">
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="zamknijModal()" style="padding:9px 16px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;">Anuluj</button>
      <button onclick="potwierdzPierwszaKolejke()" style="padding:9px 16px;border-radius:6px;border:none;background:#1a73e8;color:#fff;cursor:pointer;font-weight:500;">Utwórz</button>
    </div>
  </div>
</div>

<script>
// ── Dane z serwera (zawsze dostępne) ──────────────────
var LIGAID = <?= ligaId ?>;
var LIGA   = JSON.parse(<?= liga ?>);
var EMAIL  = <?= JSON.stringify(email) ?>;

// ── Weryfikacja hasłem ────────────────────────────────
document.getElementById('auth-nazwa-ligi').textContent = LIGA.nazwa || LIGAID;

if (!sessionStorage.getItem('panel_auth_' + LIGAID)) {
  // Niezalogowany — pokaż overlay
  document.getElementById('auth-overlay').style.display = 'flex';
} else {
  // Już zalogowany — uruchom panel od razu
  inicjalizujPanel();
}

function weryfikujHaslo() {
  var haslo = document.getElementById('haslo-input').value;
  var blad  = document.getElementById('haslo-blad');
  blad.style.display = 'none';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.ok) {
        blad.textContent = res.blad || 'Błędne hasło.';
        blad.style.display = 'block';
        return;
      }
      sessionStorage.setItem('panel_auth_' + LIGAID, '1');
      document.getElementById('auth-overlay').style.display = 'none';
      inicjalizujPanel();
    })
    .withFailureHandler(function() {
      blad.textContent = 'Błąd połączenia.';
      blad.style.display = 'block';
    })
    .doPostFromClient({ action: 'sprawdzHaslo', ligaId: LIGAID, haslo: haslo });
}

function wybierzAktywnyDzien(dniLigi) {
  var DZIEN_NUMER = { 'PON':1, 'WT':2, 'SR':3, 'CZW':4, 'PT':5, 'SOB':6, 'NIEDZ':0 };

  var now = new Date();
  var dzienJS = now.getDay();    // 0=niedz, 1=pon, ..., 6=sob
  var godzina = now.getHours();

  // Efektywny "moment" — po 22:00 traktujemy jako następny dzień
  var efektywnyDzien = (godzina >= 22) ? (dzienJS + 1) % 7 : dzienJS;

  // Posortuj dni ligi według numeru dnia tygodnia
  var posortowane = dniLigi.slice().sort(function(a, b) {
    return DZIEN_NUMER[a] - DZIEN_NUMER[b];
  });

  // Znajdź pierwszy dzień ligi >= efektywnyDzien
  for (var i = 0; i < posortowane.length; i++) {
    if (DZIEN_NUMER[posortowane[i]] >= efektywnyDzien) {
      return posortowane[i];
    }
  }

  // Jeśli żaden nie pasuje (jesteśmy po ostatnim dniu tygodnia) — wróć do pierwszego
  return posortowane[0];
}

// ── Inicjalizacja panelu — wywoływana po zalogowaniu ──
var PANEL_ZAINICJOWANY = false;
function inicjalizujPanel() {
  if (PANEL_ZAINICJOWANY) return;
  PANEL_ZAINICJOWANY = true;

  var DZIEN_AKTYWNY   = null;
  var AKTUALNY_NUMER  = 0;
  var AKTUALNY_PLIK_LIST = [];

  var grupy = LIGA.grupy
    ? LIGA.grupy.toString().split(',').map(function(g){ return g.trim().toUpperCase(); })
    : ['A'];

  document.getElementById('tytul').textContent = LIGA.nazwa || LIGAID;
  document.getElementById('email-info').textContent = EMAIL;

  // --- Zakładki dni ---
  var DZIEN_DO_POLA = {
    PON:'F_pon', WT:'F_wt', SR:'F_sr', CZW:'F_czw', PT:'F_pt', SOB:'F_sob', NIEDZ:'F_niedz'
  };
  var dniLigi = Object.keys(DZIEN_DO_POLA).filter(function(d) {
    return LIGA[DZIEN_DO_POLA[d]];
  });

  var tabsEl = document.getElementById('tabs');
  dniLigi.forEach(function(dzien) {
    var btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = dzien;
    btn.onclick = function() { wybierzDzien(dzien); };
    tabsEl.appendChild(btn);
  });

  var grupyEl = document.getElementById('grupy');
  grupy.forEach(function(gr) {
    var btn = document.createElement('button');
    btn.className = 'btn-grupa';
    btn.textContent = 'Gr. ' + gr;
    btn.id = 'btn-gr-' + gr;
    btn.onclick = function() { kliknijGrupe(gr, btn); };
    grupyEl.appendChild(btn);
  });

  document.getElementById('btn-auto-przypisz').onclick = autoPrzypiszGraczy;
  document.getElementById('btn-reset-przypisania').onclick = resetPrzypisania;
  document.getElementById('btn-wyslij').onclick = wyslijGraczy;
  document.getElementById('btn-recepcja').onclick = utworzListeRecepcji;

  if (dniLigi.length > 0) wybierzDzien(wybierzAktywnyDzien(dniLigi));

  // --- Wybór dnia ---
  function wybierzDzien(dzien) {
    DZIEN_AKTYWNY = dzien;
    document.querySelectorAll('.tab').forEach(function(t) {
      t.classList.toggle('active', t.textContent === dzien);
    });
    document.getElementById('karta-przypisania').style.display = 'none';
    document.getElementById('kolumny-grup').innerHTML = '';
    document.getElementById('lista-graczy').innerHTML = '<span class="spinner"></span>';
    // Widoczność karty "Utwórz kolejkę" ustala zaladujKolejki() na podstawie tego,
    // czy folder Kolejek dla tego dnia faktycznie działa — niezależnie od tego, który to dzień.
    zaladujKolejki(dzien);
    var spanDzien = document.getElementById('btn-recepcja-dzien');
    if (spanDzien) spanDzien.textContent = dzien;
    zaladujInfoRecepcji(dzien);
  }

  function zaladujInfoRecepcji(dzien) {
    var info = document.getElementById('recepcja-info');
    if (!info) return;
    info.textContent = 'Sprawdzam datę zapisów…';
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.wynik && res.wynik.nazwa) {
          info.style.color = '#4caf50';
          info.textContent = '→ plik: ' + res.wynik.nazwa;
        } else {
          info.style.color = '#f44336';
          info.textContent = 'Brak zakładki Zapisy dla tego dnia.';
        }
      })
      .withFailureHandler(function() {
        info.style.color = '#f44336';
        info.textContent = 'Błąd pobierania daty.';
      })
      .doPostFromClient({ action: 'pobierzGidZapisow', ligaId: LIGAID, dzien: dzien });
  }

  function resetPrzypisania() {
    AKTYWNE_GRUPY.forEach(function(g) { PRZYPISANIA[g.grupa] = []; });
    zapiszSzkic();

    // Zwróć wszystkich graczy do puli
    var listaEl = document.getElementById('lista-graczy');
    listaEl.innerHTML = '';
    AKTYWNE_GRUPY.forEach(function(g) {
      var strefa = document.getElementById('strefa-' + g.grupa);
      if (strefa) strefa.innerHTML = '';
    });
    GRACZE_DANE.forEach(function(g) {
      listaEl.appendChild(tworzKafelek(g.nazwa, 'pula'));
    });
  }

  // --- Ładowanie listy kolejek ---
  function zaladujKolejki(dzien) {
    var wrapper = document.getElementById('lista-wrapper');
    wrapper.innerHTML = '<span class="spinner"></span>';
    zablokujWszystkieGrupy(true);

    google.script.run
      .withSuccessHandler(function(res) {
        if (dzien !== DZIEN_AKTYWNY) return; // użytkownik zdążył przełączyć zakładkę — ignoruj nieaktualną odpowiedź
        // Karta "Utwórz kolejkę" ma sens tylko gdy folder Kolejek dla tego dnia faktycznie działa —
        // uniwersalnie, dla każdego dnia/ligi, nie na sztywno wg nazwy dnia.
        document.getElementById('karta-utworz-kolejke').style.display = res.ok ? 'block' : 'none';
        if (!res.ok) {
          wrapper.innerHTML = '<p class="pusty">Błąd: ' + res.blad + '</p>';
          AKTUALNY_PLIK_LIST = [];
          AKTUALNY_NUMER = 0;
        } else {
          AKTUALNY_PLIK_LIST = res.wynik;
          renderListaKolejek(res.wynik);
          aktualizujStanPrzyciskow(res.wynik);
        }
        // Sekcja z graczami ma się ładować niezależnie od tego, czy pobranie listy kolejek się powiodło.
        zaladujSekcjePrzypisania(dzien);
      })
      .withFailureHandler(function() {
        if (dzien !== DZIEN_AKTYWNY) return;
        document.getElementById('karta-utworz-kolejke').style.display = 'none';
        wrapper.innerHTML = '<p class="pusty">Błąd połączenia.</p>';
        AKTUALNY_PLIK_LIST = [];
        AKTUALNY_NUMER = 0;
        zaladujSekcjePrzypisania(dzien);
      })
      .doPostFromClient({ action: 'pobierzKolejki', ligaId: LIGAID, dzien: dzien });
  }

var TRYB_USUWANIA = false;

  function renderListaKolejek(pliki) {
    var wrapper = document.getElementById('lista-wrapper');
    if (!pliki || pliki.length === 0) {
      wrapper.innerHTML = '<p class="pusty">Brak kolejek dla tego dnia.</p>';
      TRYB_USUWANIA = false;
      return;
    }

    // Znajdź najwyższy numer kolejki
    var maxNumer = 0;
    pliki.forEach(function(p) {
      var match = p.nazwa.match(/^(\d+)\./);
      if (match) {
        var n = parseInt(match[1]);
        if (n > maxNumer) maxNumer = n;
      }
    });

    var ul = document.createElement('ul');
    ul.className = 'kolejki-lista';
    pliki.forEach(function(p) {
      var match = p.nazwa.match(/^(\d+)\./);
      var numer = match ? parseInt(match[1]) : 0;
      var jestAktywna = (numer === maxNumer);

      var li = document.createElement('li');
      li.innerHTML = '<a href="' + p.url + '" target="_blank">' + p.nazwa + '</a>';

      if (TRYB_USUWANIA && jestAktywna) {
        var btnDel = document.createElement('button');
        btnDel.textContent = '✕';
        btnDel.style.cssText = 'margin-left:12px;padding:2px 8px;border-radius:4px;border:1px solid #c62828;background:rgba(198,40,40,0.08);color:#c62828;cursor:pointer;font-size:13px;font-weight:700;';
        btnDel.onclick = (function(plik) {
          return function() { potwierdzUsuniecie(plik); };
        })(p);
        li.appendChild(btnDel);
      }

      ul.appendChild(li);
    });

    wrapper.innerHTML = '';
    wrapper.appendChild(ul);

    // Przycisk trybu usuwania
    var btnTryb = document.createElement('button');
    btnTryb.style.cssText = 'margin-top:14px;padding:8px 16px;border-radius:6px;border:1px solid #c62828;background:' + (TRYB_USUWANIA ? 'rgba(198,40,40,0.15)' : '#fff') + ';color:#c62828;cursor:pointer;font-size:13px;font-weight:600;';
    btnTryb.textContent = TRYB_USUWANIA ? '✕ Wyłącz tryb usuwania' : '🗑 Tryb usuwania';
    btnTryb.onclick = function() {
      TRYB_USUWANIA = !TRYB_USUWANIA;
      renderListaKolejek(AKTUALNY_PLIK_LIST);
    };
    wrapper.appendChild(btnTryb);
  }

  function potwierdzUsuniecie(plik) {
    if (!confirm('Czy na pewno chcesz usunąć:\n\n"' + plik.nazwa + '"?\n\nSprawdź dane zanim usuniesz. Plik trafi do kosza.')) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.ok) { toast(res.blad, true); return; }
        toast(res.wynik.komunikat);
        TRYB_USUWANIA = false;
        zaladujKolejki(DZIEN_AKTYWNY);
      })
      .withFailureHandler(function() {
        toast('Błąd połączenia.', true);
      })
      .doPostFromClient({ action:'usunKolejke', ligaId:LIGAID, dzien:DZIEN_AKTYWNY, plikId:plik.id, plikNazwa:plik.nazwa });
  }

  // --- Stan przycisków ---
  function aktualizujStanPrzyciskow(pliki) {
    var naglowek = document.getElementById('naglowek-kolejki');

    if (!pliki || pliki.length === 0) {
      AKTUALNY_NUMER = 0;
      naglowek.textContent = 'Utwórz pierwszą kolejkę';
      grupy.forEach(function(gr) {
        var btn = document.getElementById('btn-gr-' + gr);
        if (!btn) return;
        if (gr === 'A') {
          btn.disabled = false;
          btn.textContent = 'Gr. A — kolejka 1.';
        } else {
          btn.disabled = true;
          btn.textContent = 'Gr. ' + gr;
        }
      });
      return;
    }

    var ostatniNumer = 0;
    pliki.forEach(function(p) {
      var match = p.nazwa.match(/^(\d+)\.\s*Kolejka.*Gr\.?\s*A/);
      if (match) {
        var n = parseInt(match[1]);
        if (n > ostatniNumer) ostatniNumer = n;
      }
    });

    AKTUALNY_NUMER = ostatniNumer;
    naglowek.textContent = 'Utwórz ' + ostatniNumer + '. kolejkę';

    var grupy_gotowe = {};
    pliki.forEach(function(p) {
      var match = p.nazwa.match(/^(\d+)\.\s*Kolejka.*Gr\.?\s*([A-H])/);
      if (match && parseInt(match[1]) === ostatniNumer) {
        grupy_gotowe[match[2].toUpperCase()] = true;
      }
    });

    grupy.forEach(function(gr) {
      var btn = document.getElementById('btn-gr-' + gr);
      if (!btn) return;
      if (gr === 'A') {
        btn.disabled = false;
        btn.textContent = 'Gr. A — kolejka ' + (ostatniNumer + 1) + '.';
      } else {
        var maJuz = grupy_gotowe[gr] || false;
        btn.disabled = maJuz;
        btn.textContent = 'Gr. ' + gr + (maJuz ? ' ✓' : '');
      }
    });
  }

  function zablokujWszystkieGrupy(stan) {
    grupy.forEach(function(gr) {
      var btn = document.getElementById('btn-gr-' + gr);
      if (btn) btn.disabled = stan;
    });
  }

  // --- Kliknięcie grupy ---
 function kliknijGrupe(grupa, btn) {
    if (!DZIEN_AKTYWNY) { toast('Najpierw wybierz dzień.', true); return; }
    if (AKTUALNY_NUMER === 0 && grupa === 'A') {
      pokazModal();
      return;
    }
    zablokujWszystkieGrupy(true);
    utworzKolejke(grupa, btn, null);
  }

  function pokazModal() {
    var overlay = document.getElementById('modal-overlay');
    overlay.style.display = 'flex';
    document.getElementById('modal-data').value = '';
    document.getElementById('modal-data').focus();
  }

  function zamknijModal() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  function potwierdzPierwszaKolejke() {
    var data = document.getElementById('modal-data').value.trim();
    if (!/^\d{2}\.\d{2}$/.test(data)) {
      toast('Podaj datę w formacie DD.MM (np. 08.06)', true);
      return;
    }
    zamknijModal();
    var btn = document.getElementById('btn-gr-A');
    utworzKolejke('A', btn, data);
  }

  function utworzKolejke(grupa, btn, dataReczna) {
    setLoading(btn, true);
    google.script.run
      .withSuccessHandler(function(res) {
        setLoading(btn, false);
        if (!res.ok) { toast(res.blad, true); return; }
        toast(res.wynik.komunikat);
        zaladujKolejki(DZIEN_AKTYWNY);
        if (grupa.toUpperCase() === 'A') {
          zaladujSekcjePrzypisania(DZIEN_AKTYWNY);
        }
      })
      .withFailureHandler(function() {
        setLoading(btn, false);
        toast('Błąd połączenia z serwerem.', true);
      })
      .doPostFromClient({ action:'utworzKolejke', ligaId:LIGAID, dzien:DZIEN_AKTYWNY, grupa:grupa, dataReczna:dataReczna });
  }

  function utworzListeRecepcji() {
    if (!DZIEN_AKTYWNY) { toast('Najpierw wybierz dzień.', true); return; }
    var btn = document.getElementById('btn-recepcja');
    btn.disabled = true;
    btn.querySelector('span').textContent = '...';
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        document.getElementById('btn-recepcja-dzien').textContent = DZIEN_AKTYWNY;
        if (!res.ok) { toast(res.blad, true); return; }
        toast(res.wynik.komunikat);
      })
      .withFailureHandler(function() {
        btn.disabled = false;
        document.getElementById('btn-recepcja-dzien').textContent = DZIEN_AKTYWNY;
        toast('Błąd połączenia.', true);
      })
      .doPostFromClient({ action:'utworzArkuszRecepcji', ligaId:LIGAID, dzien:DZIEN_AKTYWNY });
  }

  // --- Helpers ---
  function setLoading(btn, stan) {
    btn.disabled = stan;
    if (stan) btn.textContent = '...';
  }

  function toast(msg, err) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (err ? ' err' : '');
    setTimeout(function(){ el.className = 'toast'; }, 3500);
  }

  // --- Przypisywanie graczy ---
  var GRACZE_DANE     = [];
  var AKTYWNE_GRUPY   = [];
  var PRZYPISANIA     = {};
  var AKTUALNA_DATA_KOLEJKI = '';
 var PODSWIETLENIA   = {};
  var WYBRANY_GRACZ   = null;

  function zaladujSekcjePrzypisania(dzien) {
    google.script.run
      .withSuccessHandler(function(res1) {
        if (dzien !== DZIEN_AKTYWNY) return; // zakładka zmieniła się w międzyczasie — odrzuć nieaktualną odpowiedź
        if (!res1.ok) return;
        GRACZE_DANE = res1.wynik;

        google.script.run
          .withSuccessHandler(function(res2) {
            if (dzien !== DZIEN_AKTYWNY) return;
            AKTYWNE_GRUPY = (res2.ok && res2.wynik) ? res2.wynik : [];

            if (AKTYWNE_GRUPY.length === 0) {
              // Brak aktywnej kolejki (błąd folderu Kolejek albo po prostu jeszcze żadnej nie utworzono) —
              // pokaż samą listę zapisanych graczy, bez podziału na grupy A/B/C.
              PODSWIETLENIA = {};
              renderSekcjaPrzypisania();
              document.getElementById('karta-przypisania').style.display = 'block';
              return;
            }

            google.script.run
              .withSuccessHandler(function(res3) {
                if (dzien !== DZIEN_AKTYWNY) return;
                PODSWIETLENIA = (res3.ok) ? res3.wynik : {};
                renderSekcjaPrzypisania();
                document.getElementById('karta-przypisania').style.display = 'block';
              })
              .withFailureHandler(function() {
                if (dzien !== DZIEN_AKTYWNY) return;
                PODSWIETLENIA = {};
                renderSekcjaPrzypisania();
                document.getElementById('karta-przypisania').style.display = 'block';
              })
              .doPostFromClient({ action:'pobierzWynikiPoprzedniej', ligaId:LIGAID, dzien:dzien, numerKolejki:AKTUALNY_NUMER });
          })
          .withFailureHandler(function(){
            if (dzien !== DZIEN_AKTYWNY) return;
            AKTYWNE_GRUPY = [];
            PODSWIETLENIA = {};
            renderSekcjaPrzypisania();
            document.getElementById('karta-przypisania').style.display = 'block';
          })
          .doPostFromClient({ action:'pobierzAktywneGrupy', ligaId:LIGAID, dzien:dzien });
      })
      .withFailureHandler(function(){})
      .doPostFromClient({ action:'pobierzGraczy', ligaId:LIGAID, dzien:dzien });
  }

  function renderSekcjaPrzypisania() {
    PRZYPISANIA = {};
    AKTYWNE_GRUPY.forEach(function(g) { PRZYPISANIA[g.grupa] = []; });

    // Wyciągnij datę z nazwy pierwszej kolejki aktualnego numeru
    var dataKolejki = '';
    AKTUALNY_PLIK_LIST.forEach(function(p) {
      var match = p.nazwa.match(/^(\d+)\.\s*Kolejka\s+(\d{2}\.\d{2})/);
      if (match && parseInt(match[1]) === AKTUALNY_NUMER && !dataKolejki) {
        dataKolejki = match[2];
      }
    });
    AKTUALNA_DATA_KOLEJKI = dataKolejki;

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.ok && res.wynik) {
          AKTYWNE_GRUPY.forEach(function(g) {
            if (res.wynik[g.grupa]) PRZYPISANIA[g.grupa] = res.wynik[g.grupa];
          });
        }
        budujDomPrzypisania();
      })
      .withFailureHandler(function() {
        budujDomPrzypisania();
      })
      .doPostFromClient({ action:'wczytajSzkicPrzypisania', ligaId:LIGAID, dzien:DZIEN_AKTYWNY, numerKolejki:AKTUALNY_NUMER, dataKolejki:dataKolejki });
  }

  function zapiszSzkic() {
    google.script.run
      .withFailureHandler(function() { toast('Nie udało się zapisać przypisania na serwerze.', true); })
      .doPostFromClient({ action:'zapiszSzkicPrzypisania', ligaId:LIGAID, dzien:DZIEN_AKTYWNY, numerKolejki:AKTUALNY_NUMER, dataKolejki:AKTUALNA_DATA_KOLEJKI, przypisania:PRZYPISANIA });
  }

  function budujDomPrzypisania() {
    AKTYWNE_GRUPY.forEach(function(g) {
      if (!PRZYPISANIA[g.grupa]) PRZYPISANIA[g.grupa] = [];
    });

    var listaEl = document.getElementById('lista-graczy');
    listaEl.innerHTML = '';
    var juzPrzypisani = [];
    Object.keys(PRZYPISANIA).forEach(function(gr) {
      PRZYPISANIA[gr].forEach(function(n) { juzPrzypisani.push(n); });
    });
    GRACZE_DANE.forEach(function(g) {
      if (juzPrzypisani.indexOf(g.nazwa) === -1) {
        listaEl.appendChild(tworzKafelek(g.nazwa, 'pula'));
      }
    });

    var kolumnyEl = document.getElementById('kolumny-grup');
    kolumnyEl.innerHTML = '';
    AKTYWNE_GRUPY.forEach(function(g) {
      var kol = document.createElement('div');
      kol.style.cssText = 'flex:0 0 150px;';
      kol.innerHTML = '<div style="font-size:13px;font-weight:600;color:#666;margin-bottom:8px;">Gr. ' + g.grupa + '</div>';
      var strefa = document.createElement('div');
      strefa.id = 'strefa-' + g.grupa;
      strefa.dataset.grupa = g.grupa;
      strefa.style.cssText = 'min-height:120px;border:2px dashed #ddd;border-radius:8px;padding:19px 8px;cursor:pointer;';
      strefa.addEventListener('click', function() {
        if (!WYBRANY_GRACZ) return;
        przypiszDoGrupy(WYBRANY_GRACZ.nazwa, WYBRANY_GRACZ.zrodlo, g.grupa);
        WYBRANY_GRACZ = null;
      });
      kol.appendChild(strefa);
      kolumnyEl.appendChild(kol);
    });

    AKTYWNE_GRUPY.forEach(function(g) {
      var strefa = document.getElementById('strefa-' + g.grupa);
      if (!strefa) return;
      (PRZYPISANIA[g.grupa] || []).forEach(function(nazwa) {
        strefa.appendChild(tworzKafelek(nazwa, g.grupa));
      });
    });

    var pula = document.getElementById('lista-graczy');
    pula.addEventListener('click', function() {
      if (!WYBRANY_GRACZ) return;
      if (WYBRANY_GRACZ.zrodlo !== 'pula') zwrocDoPuli(WYBRANY_GRACZ.nazwa, WYBRANY_GRACZ.zrodlo);
      WYBRANY_GRACZ = null;
    });
  }

  function tworzKafelek(nazwa, zrodlo) {
    var div = document.createElement('div');
    div.dataset.nazwa = nazwa;
    div.dataset.zrodlo = zrodlo;
    div.style.cssText = 'padding:6px 10px;margin:4px 0;border-radius:6px;font-size:13px;cursor:pointer;position:relative;';

    var KOLORY_GRUP = {
  'A': { bg:'#f3e8ff', border:'#c084fc', text:'#6b21a8' }, // fiolet
  'B': { bg:'#e0f2fe', border:'#7dd3fc', text:'#0c4a6e' }, // niebieski
  'C': { bg:'#fef9c3', border:'#fde047', text:'#713f12' }, // żółty
  'D': { bg:'#ffedd5', border:'#fdba74', text:'#7c2d12' }, // pomarańczowy
  'E': { bg:'#fce7f3', border:'#f9a8d4', text:'#831843' }, // różowy
  'F': { bg:'#e0e7ff', border:'#a5b4fc', text:'#3730a3' }, // indygo
  'G': { bg:'#cffafe', border:'#67e8f9', text:'#164e63' }, // cyjan
  'H': { bg:'#fafafa', border:'#d4d4d4', text:'#404040' }  // szary
};

    var info = PODSWIETLENIA[nazwa];
    if (info && info.length > 0) {
      var typ = info[0].typ;
      if (typ === 'awans') {
        div.style.background = '#e6f4ea';
        div.style.border = '1px solid #81c995';
        div.style.color = '#1e7e34';
        div.innerHTML = nazwa + ' <span style="font-size:11px;font-weight:600;">↑' + info[0].doGrupy + '</span>';
      } else if (typ === 'spadek') {
        div.style.background = '#fce8e6';
        div.style.border = '1px solid #f28b82';
        div.style.color = '#c62828';
        div.innerHTML = nazwa + ' <span style="font-size:11px;font-weight:600;">↓' + info[0].doGrupy + '</span>';
      } else if (typ === 'utrzymanie') {
  var ODCIENIE_GRUP = {
    'A': { bg:'#f5f5f5', border:'#d4d4d4', text:'#404040' },
    'B': { bg:'#eeeeee', border:'#bdbdbd', text:'#383838' },
    'C': { bg:'#e8e8e8', border:'#b0b0b0', text:'#303030' },
    'D': { bg:'#e0e0e0', border:'#a0a0a0', text:'#282828' },
    'E': { bg:'#d8d8d8', border:'#909090', text:'#202020' },
    'F': { bg:'#d0d0d0', border:'#808080', text:'#181818' },
    'G': { bg:'#c8c8c8', border:'#707070', text:'#101010' },
    'H': { bg:'#c0c0c0', border:'#606060', text:'#080808' }
  };
  var odcien = ODCIENIE_GRUP[info[0].wGrupie] || { bg:'#f5f5f5', border:'#bdbdbd', text:'#424242' };
  div.style.background = odcien.bg;
  div.style.border = '1px solid ' + odcien.border;
  div.style.color = odcien.text;
  div.innerHTML = nazwa + ' <span style="font-size:11px;font-weight:600;">=' + info[0].wGrupie + '</span>';
}
    } else {
      div.style.background = '#e8f0fe';
      div.style.border = '1px solid #c5d8f6';
      div.style.color = '#1a1a1a';
      div.textContent = nazwa;
    }

    div.addEventListener('click', function(e) {
      e.stopPropagation();
      wybierzKafelek(nazwa, zrodlo, div);
    });
    return div;
  }

  function wybierzKafelek(nazwa, zrodlo, div) {
    if (WYBRANY_GRACZ && WYBRANY_GRACZ.nazwa === nazwa) {
      div.style.boxShadow = '';
      div.style.outline = '';
      WYBRANY_GRACZ = null;
      return;
    }
    if (WYBRANY_GRACZ && WYBRANY_GRACZ.el) {
      WYBRANY_GRACZ.el.style.boxShadow = '';
      WYBRANY_GRACZ.el.style.outline = '';
    }
    div.style.outline = '2px solid #1a73e8';
    div.style.boxShadow = '0 0 0 2px rgba(26,115,232,.25)';
    WYBRANY_GRACZ = { nazwa: nazwa, zrodlo: zrodlo, el: div };
  }

  function znajdzKafelek(containerId, nazwa) {
    var container = document.getElementById(containerId);
    if (!container) return null;
    var kafelki = container.querySelectorAll('[data-nazwa]');
    for (var i = 0; i < kafelki.length; i++) {
      if (kafelki[i].dataset.nazwa === nazwa) return kafelki[i];
    }
    return null;
  }

 function przypiszDoGrupy(nazwa, zrodloGrupa, docelowaGrupa) {
    if (zrodloGrupa !== 'pula') {
      PRZYPISANIA[zrodloGrupa] = PRZYPISANIA[zrodloGrupa].filter(function(n){ return n !== nazwa; });
      var staryKafelek = znajdzKafelek('strefa-' + zrodloGrupa, nazwa);
      if (staryKafelek) staryKafelek.remove();
    } else {
      var pulaKafelek = znajdzKafelek('lista-graczy', nazwa);
      if (pulaKafelek) pulaKafelek.remove();
    }

    // Usuń ewentualne duplikaty gracza w innych strefach/puli
    var pulaDuplikat = znajdzKafelek('lista-graczy', nazwa);
    if (pulaDuplikat) pulaDuplikat.remove();

    PRZYPISANIA[docelowaGrupa].push(nazwa);
    var strefa = document.getElementById('strefa-' + docelowaGrupa);
    strefa.appendChild(tworzKafelek(nazwa, docelowaGrupa));
    zapiszSzkic();
  }

  function zwrocDoPuli(nazwa, zrodloGrupa) {
    PRZYPISANIA[zrodloGrupa] = PRZYPISANIA[zrodloGrupa].filter(function(n){ return n !== nazwa; });
    var staryKafelek = znajdzKafelek('strefa-' + zrodloGrupa, nazwa);
    if (staryKafelek) staryKafelek.remove();

    // Usuń ewentualny istniejący kafelek tego gracza w puli, żeby nie powstał duplikat
    var istniejacy = znajdzKafelek('lista-graczy', nazwa);
    if (istniejacy) istniejacy.remove();

    var pula = document.getElementById('lista-graczy');
    pula.appendChild(tworzKafelek(nazwa, 'pula'));
    zapiszSzkic();
  }

  function autoPrzypiszGraczy() {
    var grupy_dostepne = AKTYWNE_GRUPY.map(function(g) { return g.grupa; });
    GRACZE_DANE.forEach(function(g) {
      var nazwa = g.nazwa;
      var info = PODSWIETLENIA[nazwa];
      if (!info || info.length === 0) return;
      var typ = info[0].typ;
      var docelowaGrupa = null;
      if (typ === 'awans') docelowaGrupa = info[0].doGrupy;
      else if (typ === 'spadek') docelowaGrupa = info[0].doGrupy;
      else if (typ === 'utrzymanie') docelowaGrupa = info[0].wGrupie;
      if (!docelowaGrupa) return;
      if (grupy_dostepne.indexOf(docelowaGrupa) === -1) return;
      var juzPrzypisany = false;
      Object.keys(PRZYPISANIA).forEach(function(gr) {
        if (PRZYPISANIA[gr].indexOf(nazwa) !== -1) juzPrzypisany = true;
      });
      if (juzPrzypisany) return;
      PRZYPISANIA[docelowaGrupa].push(nazwa);
      var strefa = document.getElementById('strefa-' + docelowaGrupa);
      if (strefa) strefa.appendChild(tworzKafelek(nazwa, docelowaGrupa));
      var pulaKafelek = znajdzKafelek('lista-graczy', nazwa);
      if (pulaKafelek) pulaKafelek.remove();
    });
    zapiszSzkic();
    toast('Gracze auto-przypisani na podstawie wyników.');
  }

  function wyslijGraczy() {
    var btn = document.getElementById('btn-wyslij');
    btn.disabled = true;
    btn.textContent = '...';
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = 'Wyślij do kolejek';
        if (!res.ok) { toast(res.blad, true); return; }
        toast(res.wynik.komunikat);
      })
      .withFailureHandler(function() {
        btn.disabled = false;
        btn.textContent = 'Wyślij do kolejek';
        toast('Błąd połączenia.', true);
      })
      .doPostFromClient({ action:'przypiszGraczy', ligaId:LIGAID, dzien:DZIEN_AKTYWNY, przypisania:PRZYPISANIA });
  }

} // koniec inicjalizujPanel()
</script>

</body>
