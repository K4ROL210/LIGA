<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga Squasha — Zapisy</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #696969;
    --surface:   #12151f;
    --border:    #1f2333;
    --muted:     #434968;
    --text:      #dde1f0;
    --c0: #e8ff47;
    --c1: #47ffe8;
    --c2: #ff8547;
    --c3: #a847ff;
    --green: #3ddc84;
    --red:   #ff4757;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── NAV ── */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 0 16px;
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--c0);
    letter-spacing: 1px;
    padding: 14px 12px 14px 0;
    margin-right: 8px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { color: var(--c0); border-bottom-color: var(--c0); }

  /* ── reszta styli bez zmian ── */
  .page-wrap { padding: 28px 16px 0; }
  .header { text-align: center; margin-bottom: 28px; }
  .pill {
    display: inline-block;
    background: var(--c0); color: #000;
    font-size: 10px; font-weight: 900; letter-spacing: 3px;
    padding: 3px 12px; border-radius: 100px;
    margin-bottom: 12px; text-transform: uppercase;
  }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(38px, 9vw, 72px); line-height: .95; letter-spacing: 1px; color: #fff; }
  h1 span { color: var(--c0); }
  .sub { font-size: 25px; color: var(--c0); margin-top: 8px; }
  .top-bar { display: flex; justify-content: flex-end; margin-bottom: 14px; gap: 8px; }
  .btn { border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 12px; padding: 7px 14px; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-dark   { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-yellow { background: var(--c0); color: #000; }
  .btn-red    { background: #1f0d0d; color: var(--red); border: 1px solid var(--red); }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .login-box p { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .login-row { display: flex; gap: 8px; }
  .login-row input { flex: 1; }
  .err-msg { font-size: 11px; color: var(--red); margin-top: 8px; }
  .admin-bar { background: #081a10; border: 1px solid var(--green); border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; font-size: 12px; color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .card-head { padding: 12px 14px; border-bottom: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); display: flex; justify-content: space-between; align-items: flex-start; }
  .card-head-text { flex: 1; }
  .day-label  { font-family: 'Bebas Neue', sans-serif; font-size: 35px; color: var(--accent); letter-spacing: .5px; }
  .date-label { font-size: 35px; color: #fff; margin-top: 1px; }
  .lock-btn { background: transparent; border: none; cursor: pointer; font-size: 18px; padding: 4px 8px; transition: opacity .15s; color: var(--accent); }
  .lock-btn:hover { opacity: .75; }
  .player-list { flex: 1; min-height: 60px; }
  .player-row { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); animation: fadeIn .2s ease; }
  .player-row:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .num { font-size: 11px; color: var(--accent); min-width: 18px; text-align: right; font-weight: 700; opacity: .7; }
  .pname { flex: 1; font-size: 18px; font-weight: 500; }
  .empty { text-align: center; padding: 18px 8px; color: var(--muted); font-size: 12px; }
  .loading-txt { text-align: center; padding: 18px 8px; color: var(--muted); font-size: 11px; }
  .closed-txt { text-align: center; padding: 18px 8px; color: var(--red); font-size: 12px; font-weight: 700; }
  .icon-btn { background: transparent; border-radius: 5px; cursor: pointer; width: 22px; height: 22px; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: opacity .15s; padding: 0; font-family: inherit; }
  .icon-btn:hover { opacity: .75; }
  .icon-edit { color: var(--c0); border: 1px solid var(--c0); }
  .icon-del  { color: var(--red); border: 1px solid var(--red); }
  .icon-ok   { color: var(--green); border: 1px solid var(--green); }
  .input-row { padding: 14px 14px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  .input-row.closed { opacity: 0.5; pointer-events: none; }
  .field { flex: 1; background: #0d1020; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 14px; font-size: 16px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color .15s; }
  .field:focus { border-color: var(--accent); }
  .field.err   { border-color: var(--red); }
  .add-btn { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 7px 12px; font-weight: 900; cursor: pointer; font-size: 16px; transition: opacity .15s; line-height: 1; }
  .add-btn:hover   { opacity: .85; }
  .add-btn:disabled { opacity: .4; cursor: default; }
  footer { text-align: center; font-size: 11px; color: #2b3050; margin-top: 28px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff4; border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .contact-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 16px;
}
.contact-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 13px 24px;
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  transition: transform .15s, box-shadow .15s, opacity .15s;
  cursor: pointer;
  white-space: nowrap;
}
.contact-btn:hover { transform: translateY(-2px); opacity: .9; }
.contact-btn:active { transform: translateY(0); }
.contact-btn-fb {
  background: var(--c0);
  color: #000;
  border: 2px solid var(--c0);
  box-shadow: 0 4px 20px rgba(232,255,71,.25);
}
.contact-btn-fb:hover { box-shadow: 0 6px 28px rgba(232,255,71,.4); }
.contact-btn-sms {
  background: transparent;
  color: var(--c2);
  border: 2px solid var(--c2);
  box-shadow: 0 4px 20px rgba(255,133,71,.15);
}
.contact-btn-sms:hover { box-shadow: 0 6px 28px rgba(255,133,71,.35); }
  .today-label { font-family: 'Bebas Neue', sans-serif; color: #fff; font-weight: 700; font-size: 45px; letter-spacing: 1px; }
  .today-date  { color: var(--red); font-weight: 700; font-size: 45px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<!-- ═══ NAV ════════════════════════════════════════════════════ -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">🎾 WPC</div>
    <a class="nav-link active" href="index.html">📋 Zapisy</a>
    <a class="nav-link"        href="wyniki.html">🏆 Wyniki</a>
    <a class="nav-link"        href="ranking.html">📊 Ranking</a>
  </div>
</nav>

<!-- ═══ KONFIGURACJA ════════════════════════════════════════════ -->
<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzoudFPYGza7l7WUrPR_kjZD8OlgJFcdPnrVZgz80rMBFDRPkik1q1Wl7cnHPZqkIqFg/exec";
  const CUTOFF_HOUR = 22;
  const today = new Date();
  const day   = String(today.getDate()).padStart(2, '0');
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const todayDateStr = `${day}.${month}`;
</script>
<!-- ══════════════════════════════════════════════════════════════ -->

<div class="page-wrap">
  <div class="header">
    <div class="pill">🎾 Liga Squasha WPC</div>
    <h1>ZAPISY NA <span>LIGĘ</span></h1>
    <p class="sub">Pierwszy raz na lidze?
<div class="contact-btns">
  <a href="https://m.me/karol.kreczmanski" class="contact-btn contact-btn-fb" target="_blank">
    ⓕ &nbsp;Napisz do nas
  </a>
  <a href="tel:+48511915628" class="contact-btn contact-btn-sms">
    ✉︎ &nbsp;SMS 511 915 628
  </a>
</div>
      <span class="today-label" id="todayLabel"></span><span class="today-date" id="todayDate"></span>
    </p>
  </div>

  <div class="top-bar" id="topBar"></div>
  <div id="loginBox"></div>
  <div id="adminBar"></div>
  <div class="grid" id="grid"></div>
  <footer>Made by Karol Kreczmański</footer>
</div>

<script>
const DAYS = [
  { key:"mon", label:"Poniedziałek (trening)", short:"Pn",  dow:1 },
  { key:"tue", label:"Wtorek",                 short:"Wt",  dow:2 },
  { key:"thu", label:"Czwartek",               short:"Czw", dow:4 },
  { key:"sat", label:"Sobota",                 short:"Sob", dow:6 },
];
const COLORS = ["#e8ff47","#47ffe8","#ff8547","#a847ff"];

function getNextDate(dow) {
  const now   = new Date();
  const today = now.getDay();
  const hour  = now.getHours();
  let diff = (dow - today + 7) % 7;
  if (diff === 0 && hour >= CUTOFF_HOUR) diff = 7;
  const d = new Date(now);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function dateKey(d) {
  const day   = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year  = d.getFullYear();
  return `${year}-${month}-${day}`;
}

function formatPL(d) {
  return d.toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric"});
}

let state = {
  days:      DAYS.map((d,i) => ({ ...d, date: getNextDate(d.dow), color: COLORS[i] })),
  lists:     {},
  loading:   {},
  inputs:    {},
  saving:    {},
  editing:   null,
  editVal:   "",
  adminMode: false,
  showLogin: false,
  passInput: "",
  passErr:   false,
  locked:    {},
  adminPassword: "",
};

function saveLockedState() {
  localStorage.setItem('lockedDays', JSON.stringify(state.locked));
}

function api(params) {
  return new Promise((resolve, reject) => {
    const cbName = "jsonp_" + Math.random().toString(36).slice(2);
    let script;
    const timeout = setTimeout(() => {
      delete window[cbName];
      if (script) script.remove();
      reject(new Error("timeout"));
    }, 10000);
    window[cbName] = (data) => {
      clearTimeout(timeout);
      delete window[cbName];
      if (script) script.remove();
      resolve(data);
    };
    script = document.createElement("script");
    const p = { ...params, callback: cbName };
    script.src = APPS_SCRIPT_URL + "?" + new URLSearchParams(p).toString();
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      reject(new Error("script error"));
    };
    document.head.appendChild(script);
  });
}

async function loadDay(day) {
  state.loading[day.key] = true; render();
  const res = await api({ action:"list", dayKey:day.key, dateStr:dateKey(day.date) });
  if (res.ok) {
    state.lists[day.key]  = res.players;
    state.locked[day.key] = res.locked;
  }
  state.loading[day.key] = false; render();
}

async function addPlayer(dayKey) {
  if (state.locked[dayKey]) return;
  const day  = state.days.find(d => d.key === dayKey);
  const name = (state.inputs[dayKey]||"").trim();
  if (!name) return;
  state.saving[dayKey] = true; render();
  const res = await api({ action:"add", dayKey, dateStr:dateKey(day.date), name });
  if (res.ok) { state.lists[dayKey] = res.players; state.inputs[dayKey] = ""; }
  state.saving[dayKey] = false; render();
}

async function removePlayer(dayKey, idx) {
  const day = state.days.find(d => d.key === dayKey);
  const res = await api({ action:"remove", dayKey, dateStr:dateKey(day.date), idx, password:state.adminPassword });
  if (res.ok) { state.lists[dayKey] = res.players; render(); }
}

async function saveEdit(dayKey) {
  if (!state.editing) return;
  const day = state.days.find(d => d.key === dayKey);
  const res = await api({ action:"edit", dayKey, dateStr:dateKey(day.date), idx:state.editing.idx, newName:state.editVal, password:state.adminPassword });
  if (res.ok) { state.lists[dayKey] = res.players; state.editing = null; render(); }
}

async function toggleLocked(dayKey) {
  const day    = state.days.find(d => d.key === dayKey);
  const action = state.locked[dayKey] ? "unlock" : "lock";
  const res    = await api({ action, dayKey, dateStr:dateKey(day.date), password:state.adminPassword });
  if (res.ok) {
    state.locked[dayKey] = res.locked;
    saveLockedState();
    render();
  }
}

function render() {
  renderTopBar();
  renderLoginBox();
  renderAdminBar();
  renderGrid();
  renderTodayDate();
}

function renderTodayDate() {
  const label = document.getElementById("todayLabel");
  const date  = document.getElementById("todayDate");
  if (label) label.textContent = "DZISIAJ ";
  if (date)  date.textContent  = todayDateStr;
}

function renderTopBar() {
  const el = document.getElementById("topBar");
  el.innerHTML = "";
  if (state.adminMode) {
    el.appendChild(mkBtn("Wyłącz admina","btn btn-red", () => { state.adminMode=false; render(); }));
  } else {
    el.appendChild(mkBtn("🔐 Admin","btn btn-dark", () => { state.showLogin=!state.showLogin; render(); }));
  }
}

function renderLoginBox() {
  const el = document.getElementById("loginBox");
  if (!state.showLogin || state.adminMode) { el.innerHTML=""; return; }
  el.innerHTML = `
    <div class="login-box">
      <p>Hasło administratora:</p>
      <div class="login-row">
        <input class="field${state.passErr?" err":""}" id="passInp" type="password" placeholder="Wpisz hasło…" value="${esc(state.passInput)}" />
        <button class="btn btn-yellow" id="passOk">OK</button>
        <button class="btn btn-dark"   id="passX">✕</button>
      </div>
      ${state.passErr ? '<p class="err-msg">Błędne hasło</p>' : ""}
    </div>`;
  const inp = el.querySelector("#passInp");
  inp.addEventListener("input",  e => { state.passInput=e.target.value; state.passErr=false; });
  inp.addEventListener("keydown", e => { if(e.key==="Enter") tryLogin(); });
  el.querySelector("#passOk").addEventListener("click", tryLogin);
  el.querySelector("#passX").addEventListener("click", () => { state.showLogin=false; state.passInput=""; state.passErr=false; render(); });
  inp.focus();
}

function renderAdminBar() {
  const el = document.getElementById("adminBar");
  el.innerHTML = state.adminMode
    ? '<div class="admin-bar">✓ Tryb administratora — możesz edytować, usuwać wpisy i zamykać zapisy</div>'
    : "";
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const day of [...state.days].sort((a, b) => a.date - b.date)) {
    grid.appendChild(mkCard(day));
  }
}

function mkCard(day) {
  const players  = state.lists[day.key] || [];
  const loading  = state.loading[day.key];
  const saving   = state.saving[day.key];
  const isClosed = state.locked[day.key];

  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--accent", day.color);

  const headDiv = document.createElement("div");
  headDiv.className = "card-head";
  const textDiv = document.createElement("div");
  textDiv.className = "card-head-text";
  textDiv.innerHTML = `<div class="day-label">${day.label}</div><div class="date-label">${formatPL(day.date)}</div>`;
  headDiv.appendChild(textDiv);

  if (state.adminMode) {
    const lockBtn = document.createElement("button");
    lockBtn.className = "lock-btn";
    lockBtn.textContent = isClosed ? "🔒" : "🔓";
    lockBtn.addEventListener("click", () => toggleLocked(day.key));
    headDiv.appendChild(lockBtn);
  }
  card.appendChild(headDiv);

  const list = document.createElement("div");
  list.className = "player-list";

  if (isClosed) {
    list.innerHTML = `<div class="closed-txt">Zapisy zamknięte</div>`;
  } else if (loading) {
    list.innerHTML = `<div class="loading-txt"><span class="spinner"></span></div>`;
  } else if (players.length === 0) {
    list.innerHTML = `<div class="empty">Brak zapisanych</div>`;
  } else {
    players.forEach((name, i) => {
      const isEdit = state.editing && state.editing.dayKey === day.key && state.editing.idx === i;
      const row = document.createElement("div");
      row.className = "player-row";
      row.innerHTML = `<span class="num">${i+1}</span>`;

      if (state.adminMode && isEdit) {
        const inp = document.createElement("input");
        inp.className = "field"; inp.value = state.editVal; inp.style.flex = "1";
        inp.addEventListener("input",  e => state.editVal = e.target.value);
        inp.addEventListener("keydown", e => {
          if (e.key==="Enter")  saveEdit(day.key);
          if (e.key==="Escape") { state.editing=null; render(); }
        });
        row.appendChild(inp);
        setTimeout(() => inp.focus(), 0);
        row.appendChild(mkIconBtn("✓","icon-btn icon-ok", () => saveEdit(day.key)));
      } else {
        const span = document.createElement("span");
        span.className = "pname"; span.textContent = name;
        row.appendChild(span);
        if (state.adminMode) {
          const wrap = document.createElement("div");
          wrap.style.display="flex"; wrap.style.gap="4px";
          wrap.appendChild(mkIconBtn("✎","icon-btn icon-edit", () => { state.editing={dayKey:day.key,idx:i}; state.editVal=name; render(); }));
          wrap.appendChild(mkIconBtn("✕","icon-btn icon-del",  () => removePlayer(day.key, i)));
          row.appendChild(wrap);
        }
      }
      list.appendChild(row);
    });
  }
  card.appendChild(list);

  const inputRow = document.createElement("div");
  inputRow.className = "input-row" + (isClosed ? " closed" : "");
  const inp = document.createElement("input");
  inp.className = "field"; inp.type = "text";
  inp.placeholder = isClosed ? "Zapisy zamknięte" : "Imię i nazwisko…";
  inp.value = state.inputs[day.key] || "";
  inp.disabled = isClosed;
  inp.addEventListener("input",  e => state.inputs[day.key] = e.target.value);
  inp.addEventListener("keydown", e => { if(e.key==="Enter" && !isClosed) addPlayer(day.key); });
  const addB = document.createElement("button");
  addB.className = "add-btn"; addB.style.background = day.color;
  addB.disabled = !!saving || isClosed;
  addB.innerHTML = saving ? '<span class="spinner"></span>' : "+";
  addB.addEventListener("click", () => addPlayer(day.key));
  inputRow.appendChild(inp); inputRow.appendChild(addB);
  card.appendChild(inputRow);

  return card;
}

function mkBtn(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = cls; b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function mkIconBtn(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = cls; b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }

async function tryLogin() {
  const res = await api({ action:"checkPassword", password: state.passInput });
  if (res.ok) {
    state.adminMode     = true;
    state.adminPassword = state.passInput;
    state.showLogin     = false;
    state.passInput     = "";
    state.passErr       = false;
  } else {
    state.passErr = true;
  }
  render();
}

render();
Promise.all(state.days.map(loadDay));
</script>
