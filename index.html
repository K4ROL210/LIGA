<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista Graczy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0d0f14;
      --surface: #13161f;
      --card:    #1a1e2a;
      --border:  #252a38;
      --accent:  #e8ff47;
      --accent2: #47ffe8;
      --text:    #eef0f6;
      --muted:   #6b7394;
      --radius:  14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 32px 16px 64px;
      position: relative; overflow-x: hidden;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%;
      filter: blur(120px); opacity: .18; pointer-events: none; z-index: 0;
    }
    body::before { width:600px;height:600px;background:var(--accent);top:-200px;left:-200px; }
    body::after  { width:500px;height:500px;background:var(--accent2);bottom:-150px;right:-150px; }
    .wrapper { position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;gap:24px; }
    header { text-align:center;padding-top:8px; }
    .logo-tag { display:inline-block;background:var(--accent);color:#000;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:3px;padding:4px 12px;border-radius:4px;margin-bottom:12px; }
    h1 { font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,10vw,68px);line-height:1;letter-spacing:2px; }
    h1 span { color:var(--accent); }
    .subtitle { color:var(--muted);font-size:14px;margin-top:6px; }
    .status-bar { display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px; }
    .live-badge { display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.5px; }
    .live-dot { width:9px;height:9px;background:#3ddc84;border-radius:50%;animation:pulse 1.8s infinite; }
    @keyframes pulse {
      0%  { box-shadow:0 0 0 0 rgba(61,220,132,.5); }
      70% { box-shadow:0 0 0 8px rgba(61,220,132,0); }
      100%{ box-shadow:0 0 0 0 rgba(61,220,132,0); }
    }
    .countdown { font-size:12px;color:var(--muted); }
    .countdown strong { color:var(--accent2);font-variant-numeric:tabular-nums; }
    .links-section { display:flex;flex-direction:column;gap:10px; }
    .link-btn { display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;color:var(--text);text-decoration:none;font-weight:500;font-size:15px;transition:border-color .2s,transform .15s,background .2s; }
    .link-btn:hover { border-color:var(--accent);background:#1f2433;transform:translateY(-2px); }
    .link-btn .icon { width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0; }
    .link-btn.primary .icon   { background:var(--accent); }
    .link-btn.secondary .icon { background:#1e2d4a; }
    .link-btn .arrow { margin-left:auto;opacity:.4;font-size:18px; }
    .players-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
    .card-header { padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between; }
    .card-title { font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px; }
    .player-count { background:var(--accent);color:#000;font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px; }
    .players-list { list-style:none;padding:8px 0; }
    .players-list li { display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--border);animation:fadeIn .35s ease forwards;opacity:0; }
    .players-list li:last-child { border-bottom:none; }
    @keyframes fadeIn { from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)} }
    .player-num { font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);width:24px;text-align:right;flex-shrink:0; }
    .player-name { font-size:15px;font-weight:500; }
    .state-msg { text-align:center;padding:40px 20px;color:var(--muted);font-size:14px; }
    .state-msg .emoji { font-size:32px;display:block;margin-bottom:10px; }
    footer { text-align:center;font-size:12px;color:var(--muted);margin-top:8px; }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo-tag">🎾 ZAPISY</div>
    <h1>LISTA<br/><span>GRACZY</span></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="status-bar">
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <div class="countdown">Odświeżenie za <strong id="timer">0:30</strong></div>
  </div>

  <div class="links-section" id="linksSection"></div>

  <div class="players-card">
    <div class="card-header">
      <div class="card-title">Zapisani gracze</div>
      <div class="player-count" id="playerCount">–</div>
    </div>
    <div id="listContainer">
      <div class="state-msg"><span class="emoji">⏳</span>Ładowanie listy…</div>
    </div>
  </div>

  <footer>Strona odświeża się automatycznie • Dane z Google Sheets</footer>
</div>

<script>
/* ════════ KONFIGURACJA ════════ */
const CONFIG = {
  PUBLISHED_BASE: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4MLkw50iP2O1GC7fgLaKUbK2oD9aOgRDhVd85J1WelK0bJx1Zja7s_F968UnhAaBoOBRyv3JuA_V-/pub',
  GID:          '32007859',

  FIRST_NAME_COL: 5,   // kolumna F (imię)
  LAST_NAME_COL:  6,   // kolumna G (nazwisko)

  // Wiersze z danymi: 3–16 → pomijamy 2 wiersze nagłówka
  SKIP_ROWS: 2,
  // Maksymalny wiersz z danymi (16 − 2 nagłówki = 14 wierszy)
  MAX_ROWS: 14,

  SUBTITLE: 'Czwartek 14.05',
  LINKS: [
    { label: 'Zapisz się',     url: 'https://forms.gle/3YWDogdP5g2cQxXXA',  emoji: '📋', primary: true  },
    { label: 'Nasz Instagram', url: 'https://instagram.com/ligasquashawpc',   emoji: '📸', primary: false },
  ],
};
/* ════════ KONIEC KONFIGURACJI ════════ */

const REFRESH_SEC = 30;
const $ = id => document.getElementById(id);

// Parser CSV obsługujący cudzysłowy i nowe linie wewnątrz komórek
function parseCSV(text) {
  const rows = [];
  let cur = '', inQ = false, cols = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      cols.push(cur); cur = '';
    } else if ((ch === '\n' || ch === '\r') && !inQ) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      cols.push(cur); cur = '';
      if (cols.some(c => c !== '')) rows.push(cols);
      cols = [];
    } else {
      cur += ch;
    }
  }
  cols.push(cur);
  if (cols.some(c => c !== '')) rows.push(cols);
  return rows;
}

function csvURL() {
  return `${CONFIG.PUBLISHED_BASE}?output=csv&gid=${CONFIG.GID}&_=${Date.now()}`;
}

async function fetchPlayers() {
  const res = await fetch(csvURL());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const rows = parseCSV(text).slice(CONFIG.SKIP_ROWS, CONFIG.SKIP_ROWS + CONFIG.MAX_ROWS);

  return rows
    .map(cols => {
      const first = (cols[CONFIG.FIRST_NAME_COL] || '').trim();
      const last  = (cols[CONFIG.LAST_NAME_COL]  || '').trim();
      return [first, last].filter(Boolean).join(' ');
    })
    .filter(Boolean);
}

function renderPlayers(players) {
  $('playerCount').textContent = players.length;
  const container = $('listContainer');
  if (players.length === 0) {
    container.innerHTML = `<div class="state-msg"><span class="emoji">😴</span>Brak zapisanych graczy</div>`;
    return;
  }
  const ul = document.createElement('ul');
  ul.className = 'players-list';
  players.forEach((name, i) => {
    const li = document.createElement('li');
    li.style.animationDelay = (i * 40) + 'ms';
    li.innerHTML = `<span class="player-num">${i+1}</span><span class="player-name">${escHtml(name)}</span>`;
    ul.appendChild(li);
  });
  container.innerHTML = '';
  container.appendChild(ul);
}

function renderError() {
  $('listContainer').innerHTML = `<div class="state-msg"><span class="emoji">❌</span>Nie można pobrać danych.<br/>Sprawdź czy arkusz jest publiczny.</div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderLinks() {
  const sec = $('linksSection');
  CONFIG.LINKS.forEach(link => {
    const a = document.createElement('a');
    a.href = link.url; a.target = '_blank'; a.rel = 'noopener';
    a.className = 'link-btn ' + (link.primary ? 'primary' : 'secondary');
    a.innerHTML = `<div class="icon">${link.emoji}</div>${escHtml(link.label)}<span class="arrow">›</span>`;
    sec.appendChild(a);
  });
}

let remaining = REFRESH_SEC;
function tick() {
  remaining--;
  if (remaining < 0) { remaining = REFRESH_SEC; load(); }
  $('timer').textContent = `${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;
}

async function load() {
  try { renderPlayers(await fetchPlayers()); }
  catch(e) { console.error(e); renderError(); }
}

document.title = 'Lista Graczy';
$('subtitle').textContent = CONFIG.SUBTITLE;
renderLinks();
load();
setInterval(tick, 1000);
setInterval(load, REFRESH_SEC * 1000);
</script>
</body>
</html>
